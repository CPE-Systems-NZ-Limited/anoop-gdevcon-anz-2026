name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/slides-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slides-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish slides/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./slides
          publish_branch: gh-pages
          exclude_assets: "Dockerfile,nginx.conf,.dockerignore,serve.py,serve.bat,scripts/**,README.md"
          enable_jekyll: false
